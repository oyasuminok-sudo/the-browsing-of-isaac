name: Asyncify compatibility source tests

on:
  push:
    branches:
      - ios-jspi-compatibility
  pull_request:
    branches:
      - main

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Asyncify and JSPI profile wiring
        run: node --test tests/recomp-jspi.test.js

  asyncify-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Emscripten
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version
      - name: Compile and run an Asyncify Promise bridge
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc tests/asyncify-smoke.c -O2 \
            -sASYNCIFY=1 \
            -sASYNCIFY_STACK_SIZE=65536 \
            -sASYNCIFY_IMPORTS=__asyncjs__async_probe \
            -sSUPPORT_LONGJMP=emscripten \
            --no-entry \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=node \
            -sEXPORTED_FUNCTIONS=_async_probe_entry \
            -o "$RUNNER_TEMP/asyncify-smoke.mjs"
          node tests/run-asyncify-smoke.mjs "$RUNNER_TEMP/asyncify-smoke.mjs"
