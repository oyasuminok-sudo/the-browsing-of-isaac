name: Asyncify compatibility source tests

on:
  push:
    branches:
      - ios-jspi-compatibility
  pull_request:
    branches:
      - main

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Asyncify and JSPI profile wiring
        run: node --test tests/recomp-jspi.test.js
